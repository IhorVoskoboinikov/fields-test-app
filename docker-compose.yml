# Усі значення задані тут, секретів немає — compose стартує без .env.
# Потрібен Docker Compose v2+ (`docker compose`).
# Значення беруться з .env (шаблон — .env.example); без .env діють значення
# за замовчуванням після ":-", тож проєкт стартує однією командою.
name: fields-api

x-db-credentials: &db-credentials
  POSTGRES_USER: ${POSTGRES_USER:-fields}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fields}
  POSTGRES_DB: ${POSTGRES_DB:-fields}

x-app-env: &app-env
  <<: *db-credentials
  # Усередині мережі compose база доступна як db:5432 (незалежно від .env)
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgis/postgis:16-3.4
    environment: *db-credentials
    ports:
      - "${POSTGRES_PORT:-5433}:5432"  # 5433 на хості — не конфліктує з локальним Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: перевірка по TCP не дає хибного «ready», поки образ
      # виконує init-скрипти на тимчасовому сервері (він слухає лише unix-сокет)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrate:
    build: .
    environment: *app-env
    command: sh -c "python -m scripts.wait_for_db && alembic upgrade head"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    environment: *app-env
    # Нічого не робить, якщо таблиця не порожня
    command: python -m scripts.seed
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      # Міграція впала → api не стартує (fail fast)
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      # Desktop-режим: pgAdmin відкривається без логіна
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Обов'язкові для старту контейнера навіть у desktop-режимі
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
